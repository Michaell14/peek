name: Release

# Publishes a version: the file people download from the website, and the one
# installed copies of Blink update themselves to.
#
# It runs by itself whenever a change to the app lands on the default branch
# (a merged pull request, say), and publishes the next patch version: 0.1.0,
# then 0.1.1. Changes to the website, tests or docs alone publish nothing.
#
# To choose the number yourself, for a bigger step such as 0.2.0:
#   On GitHub: Actions → Release → Run workflow, and type the version.
#   Or from a terminal: git tag v0.2.0 && git push origin v0.2.0
# The automatic ones carry on from there.
#
# Blink only offers an update when the published version is newer than the
# one that is running.
on:
  push:
    tags: ['v*']
    branches: ['**']
    # Only for branch pushes; GitHub ignores paths for tags.
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Scripts/build-app.sh'
      - 'Scripts/package.sh'
      - 'Scripts/notarize.sh'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.2.0. Leave empty for the next patch version.
        required: false

permissions:
  contents: write

# One release at a time, each waiting for the last, so two changes landing
# together do not both claim the same number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pushes to other branches stop here.
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    # Long enough for Apple's notary service to answer, twice.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        env:
          TYPED: ${{ inputs.version }}
        run: |
          if [ -n "$TYPED" ]; then
            version="$TYPED"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            # One past the highest version tagged so far.
            last="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+(\.[0-9]+){1,2}$' | head -1 || true)"
            last="${last#v}"
            IFS=. read -r major minor patch <<< "${last:-0.0.0}"
            version="${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
            echo "Last release: ${last:-none}. Publishing $version."
          fi
          version="${version#v}"
          if [ "$GITHUB_REF_TYPE" != tag ] && git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version has already been published. Use a higher version."
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::\"$version\" is not a version like 0.2.0"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      # With these five secrets the release is signed with a Developer ID and
      # notarized, and macOS opens the download without refusing it. Without
      # them it is signed ad hoc. The README says how to set them, under
      # "Releasing".
      - name: Signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "::notice::No Developer ID certificate in the secrets: signing ad hoc, not notarizing."
            exit 0
          fi
          for name in DEVELOPER_ID_P12_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing."
              exit 1
            fi
          done

          # A keychain of its own, which goes away with the runner.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12 holds no usable Developer ID Application certificate."
            exit 1
          fi

          # Checks the Apple ID with Apple as it saves it.
          xcrun notarytool store-credentials blink-release --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

          {
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_PROFILE=blink-release"
            echo "NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build
        run: UNIVERSAL=1 Scripts/build-app.sh

      # The end-to-end check CI runs, on the very app about to be published:
      # nothing is released unless it passes. See Sources/Blink/App/SmokeTest.swift.
      - name: Self-check
        run: Scripts/self-check.sh "$RUNNER_TEMP/smoke"

      - name: Self-check report
        if: always()
        run: cat "$RUNNER_TEMP/smoke/smoke.json" 2>/dev/null || echo "no report was written"

      - name: Package
        run: Scripts/package.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/Blink.dmg dist/Blink.zip dist/checksums.txt \
            --title "Blink $VERSION" --generate-notes --target "$GITHUB_SHA"

name: Release

# Pushing a tag like v0.1.0 builds a universal app and attaches it to a
# GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build
        run: |
          UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" Scripts/build-app.sh
          ditto -c -k --keepParent build/Blink.app "Blink-${GITHUB_REF_NAME#v}.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Blink-${GITHUB_REF_NAME#v}.zip" --generate-notes

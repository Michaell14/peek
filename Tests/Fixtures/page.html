<!doctype html>
<!-- Loaded by the app's self-check (see Sources/Blink/App/SmokeTest.swift),
     which serves this directory at http://127.0.0.1:<port>/. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Blink self-check page</title>
  <style>
    body { font: 15px -apple-system, sans-serif; margin: 20px; }
    div, ins { margin: 12px 0; padding: 10px; background: #eef; }
  </style>
</head>
<body>
  <h1 id="headline">A headline to hide by clicking</h1>
  <p id="body-text">Text that should stay visible throughout.</p>
  <input id="field" placeholder="The self-check types here">

  <!-- Hidden by the built-in cookie banner and ad lists. -->
  <div id="onetrust-consent-sdk">We value your privacy. Accept all cookies?</div>
  <ins class="adsbygoogle" style="display: block; height: 60px">An empty ad slot</ins>

  <!-- Hidden by a filter the self-check adds as the user would. -->
  <div class="custom-hidden">Hidden by a custom filter</div>

  <!-- Same picture twice: once from this site, once from a host the
       self-check blocks. Only the first may load. -->
  <img id="allowed" src="pixel.gif" alt="">
  <img id="blocked" alt="">
  <!-- Signs in the way "Sign in with Google" does: a pop-up that reports
       back to this page and then closes itself. -->
  <button id="signin" type="button">Sign in</button>

  <script>
    document.getElementById('signin').addEventListener('click', function () {
      window.signinOpened = Boolean(window.open('signin.html', 'signin', 'width=460,height=560'));
    });
    window.addEventListener('message', function (event) {
      if (event.origin === location.origin && event.data && event.data.signedIn) {
        document.documentElement.dataset.signedIn = event.data.signedIn;
      }
    });

    document.getElementById('blocked').src = 'http://localhost:' + location.port + '/pixel.gif';

    // Lets the self-check see whether pointer movement reaches the page.
    document.addEventListener('mousemove', function () {
      var root = document.documentElement;
      root.dataset.moves = String(Number(root.dataset.moves || 0) + 1);
    });
  </script>
</body>
</html>

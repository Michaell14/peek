<!doctype html>
<!-- The pop-up that page.html opens, standing in for a provider's sign-in
     page. The self-check presses its button, as a person would after typing
     their password. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <style>body { font: 15px -apple-system, sans-serif; margin: 24px; }</style>
</head>
<body>
  <h1>Sign in to the self-check</h1>
  <input id="password" type="password" placeholder="Password">
  <button id="done" type="button">Continue</button>
  <script>
    document.getElementById('done').addEventListener('click', function () {
      window.opener.postMessage({ signedIn: 'yes' }, location.origin);
      window.close();
    });
  </script>
</body>
</html>

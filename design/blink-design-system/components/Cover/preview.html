<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Blink — cover</title>
<style>
html, body { margin: 0; height: 100%; background: var(--desktop); }
.cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--desktop); font-family: var(--font-sans); }
.cv svg { position: absolute; inset: 0; }
.tile { fill: var(--tile); }
.raised { fill: var(--tile-raised); }
.brand { fill: var(--brand); }
.accent { fill: var(--accent); }
.dim { fill: var(--mark-dim); }
.wall1 { fill: var(--wall-1); }
.wall2 { fill: var(--wall-2); }
.wall3 { fill: var(--wall-3); }
.edge { fill: none; stroke: var(--stroke-strong); stroke-width: 1; }
.r { rx: var(--radius-tile); }
.pill { rx: 32px; }
.cv-text { position: absolute; left: 40px; bottom: 34px; max-width: 440px; }
.cv-name { margin: 0; color: var(--ink); font-size: 120px; font-weight: 600; line-height: 0.92; letter-spacing: -5px; }
.cv-tag { margin: 12px 0 0; color: var(--ink-2); font-size: 14px; line-height: 20px; }
</style></head>
<body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: brand (the lit tile, 150x260), wall-3 (the dusk glow, 168x130), wall-2 and wall-1 (the sea and the deep blue), accent (126x64 pill), mark-dim, radius-tile corners
arrangement: a board of tiles right of x=480 bleeding off the right and bottom edges, columns tile-gap apart, as Blink's board looks from its top-left
pattern: geometric, modular, dense UI -> tiles cut by the radius token, one tall like a tile in Flow; the product is a board of tiles with one lit
scales: tile-gap 14px between blocks, canvas-padding 28px top inset, radius-tile 18px, the accent block a pill (radius-pill, half its height)
-->
<rect class="wall2 r" x="508" y="28" width="120" height="86"/>
<rect class="dim r" x="508" y="128" width="120" height="86"/>
<rect class="tile r" x="508" y="228" width="120" height="86"/>
<rect class="brand r" x="642" y="28" width="150" height="260"/>
<rect class="wall1 r" x="806" y="28" width="126" height="64"/>
<rect class="accent pill" x="806" y="106" width="126" height="64"/>
<rect class="wall3 r" x="806" y="184" width="168" height="130"/>
<rect class="edge r" x="508.5" y="28.5" width="119" height="85"/>
</svg>
<div class="cv-text"><p class="cv-name">Blink</p><p class="cv-tag">Smoked glass and one clear accent, for the things you check all day.</p></div>
</div>
</body>
</html>

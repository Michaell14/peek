<script>
document.querySelectorAll('.bk-seg').forEach(function (seg) {
  var thumb = seg.querySelector('.bk-seg__thumb');
  function place(button) {
    seg.style.setProperty('--x', button.offsetLeft + 'px');
    seg.style.setProperty('--w', button.offsetWidth + 'px');
  }
  seg.querySelectorAll('.bk-seg__opt').forEach(function (button) {
    button.addEventListener('click', function () {
      seg.querySelectorAll('.bk-seg__opt').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      place(button);
      seg.dispatchEvent(new CustomEvent('change', { detail: button.dataset.value }));
    });
  });
  var on = seg.querySelector('[aria-pressed="true"]');
  if (on) { thumb.style.transition = 'none'; place(on); requestAnimationFrame(function () { thumb.style.transition = ''; }); }
});

var names = {};

      other.classList.toggle('is-selected', other === card);
      other.setAttribute('aria-pressed', String(other === card));
    });
    useButton.textContent = 'Use ' + names[card.dataset.template];
    useButton.dataset.template = card.dataset.template;
  });
});

function build(key) {
  board.innerHTML = boards[key] || '';
  frame.classList.add('is-built');
  var tiles = Array.from(board.querySelectorAll('.bk-tile'));
  setTimeout(function () {
    tiles.forEach(function (tile, i) { setTimeout(function () { tile.classList.add('is-in'); }, i * 70); });
  }, 120);
  wire(board);
}
function wire(root) {
  root.querySelectorAll('.bk-msg').forEach(function (box) {
    box.querySelectorAll('.bk-mrow[data-open]').forEach(function (row) { row.addEventListener('click', function () { box.classList.add('is-open'); }); });
    var back = box.querySelector('[data-back]'); if (back) back.addEventListener('click', function () { box.classList.remove('is-open'); });
  });
  root.querySelectorAll('.bk-rem__check').forEach(function (check) { check.addEventListener('click', function () { check.closest('.bk-rem__item').classList.toggle('is-done'); }); });
}
useButton.addEventListener('click', function () { build(useButton.dataset.template); });
document.querySelector('[data-empty]').addEventListener('click', function () { build('empty'); });
document.querySelector('.fr-again').addEventListener('click', function () { frame.classList.remove('is-built'); board.innerHTML = ''; });

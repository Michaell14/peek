<!-- @dsCard group="Chrome" height=120 subtitle="Click to switch" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl — preview</title><style>html,body{margin:0;height:100%;background:var(--desktop);}</style></head>
<body>
<div class="bk-ground"><div class="bk-stack" style="justify-items:start"><div class="bk-seg" role="group"><span class="bk-seg__thumb"></span><button class="bk-seg__opt" type="button" data-value="today" aria-pressed="true">Today</button><button class="bk-seg__opt" type="button" data-value="later" aria-pressed="false">Later</button><button class="bk-seg__opt" type="button" data-value="all" aria-pressed="false">All</button></div><div class="bk-seg" role="group"><span class="bk-seg__thumb"></span><button class="bk-seg__opt" type="button" data-value="day" aria-pressed="false">Day</button><button class="bk-seg__opt" type="button" data-value="week" aria-pressed="true">7 Days</button></div></div></div>
<script>
document.querySelectorAll('.bk-seg').forEach(function (seg) {
  var thumb = seg.querySelector('.bk-seg__thumb');
  function place(button) {
    seg.style.setProperty('--x', button.offsetLeft + 'px');
    seg.style.setProperty('--w', button.offsetWidth + 'px');
  }
  seg.querySelectorAll('.bk-seg__opt').forEach(function (button) {
    button.addEventListener('click', function () {
      seg.querySelectorAll('.bk-seg__opt').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      place(button);
      seg.dispatchEvent(new CustomEvent('change', { detail: button.dataset.value }));
    });
  });
  var on = seg.querySelector('[aria-pressed="true"]');
  if (on) { thumb.style.transition = 'none'; place(on); requestAnimationFrame(function () { thumb.style.transition = ''; }); }
});
</script>
</body>
</html>

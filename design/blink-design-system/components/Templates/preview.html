<!doctype html>
<html>
<head><meta charset="utf-8"><title>Templates — preview</title><style>html,body{margin:0;height:100%;background:var(--desktop);}</style></head>

<div class="bk-ground"><div style="padding:36px 24px"><div class="bk-tpl" role="dialog" aria-label="Start with a board"><div class="bk-tpl__head"><h2>Start with a board</h2><p>Pick what you check most. Every tile can be moved, removed or swapped later.</p></div><div class="bk-tpl__grid"><button class="bk-tcard bk-tile is-selected" type="button" data-template="workday" aria-pressed="true"><span class="bk-tcard__map" aria-hidden="true"><span class="bk-tcard__board"><i style="left:0.00%;top:0.00%;width:calc(32.19% - 7px);height:calc(102.15% - 7px)"><b><i class="bk-ico bk-ico--calendar" aria-hidden="true"></i>Calendar</b><s></s><s></s><s></s><s></s><s></s><s></s></i><i style="left:32.19%;top:0.00%;width:calc(32.19% - 7px);height:calc(51.07% - 7px)"><b><i class="bk-ico bk-ico--checklist" aria-hidden="true"></i>Reminders</b><s></s><s></s><s></s></i><i style="left:32.19%;top:51.07%;width:calc(32.19% - 7px);height:calc(51.07% - 7px)"><b><i class="bk-ico bk-ico--messages" aria-hidden="true"></i>Messages</b><s></s><s></s><s></s></i><i class="is-web" style="left:64.38%;top:0.00%;width:calc(36.76% - 7px);height:calc(102.15% - 7px)"><b>mail.google.com</b><em><s></s><s></s><s></s><s></s><s></s><s></s></em></i></span><span class="bk-tcard__check"><i class="bk-ico bk-ico--check" aria-hidden="true"></i></span></span><span class="bk-tcard__text"><b>Workday</b><span>What's next, what's due and who's waiting.</span></span><span class="bk-tcard__has"><span>Calendar</span><span>Reminders</span><span>Messages</span><span>Gmail</span></span></button><button class="bk-tcard bk-tile" type="button" data-template="engineering" aria-pressed="false"><span class="bk-tcard__map" aria-hidden="true"><span class="bk-tcard__board"><i class="is-web" style="left:0.00%;top:0.00%;width:calc(43.63% - 7px);height:calc(102.15% - 7px)"><b>github.com/pulls</b><em><s></s><s></s><s></s><s></s><s></s><s></s></em></i><i class="is-web" style="left:43.63%;top:0.00%;width:calc(32.19% - 7px);height:calc(63.50% - 7px)"><b>vercel.com/dashboard</b><em><s></s><s></s><s></s><s></s></em></i><i style="left:43.63%;top:63.50%;width:calc(32.19% - 7px);height:calc(38.65% - 7px)"><b><i class="bk-ico bk-ico--clock" aria-hidden="true"></i>Clock</b><s></s><s></s></i><i style="left:75.82%;top:0.00%;width:calc(25.33% - 7px);height:calc(102.15% - 7px)"><b><i class="bk-ico bk-ico--note" aria-hidden="true"></i>Notes</b><s></s><s></s><s></s><s></s><s></s><s></s></i></span><span class="bk-tcard__check"><i class="bk-ico bk-ico--check" aria-hidden="true"></i></span></span><span class="bk-tcard__text"><b>Engineering</b><span>Reviews, builds and your team's time zones.</span></span><span class="bk-tcard__has"><span>GitHub</span><span>Deploys</span><span>Clock</span><span>Notes</span></span></button><button class="bk-tcard bk-tile" type="button" data-template="remote" aria-pressed="false"><span class="bk-tcard__map" aria-hidden="true"><span class="bk-tcard__board"><i style="left:0.00%;top:0.00%;width:calc(30.56% - 7px);height:calc(48.16% - 7px)"><b><i class="bk-ico bk-ico--clock" aria-hidden="true"></i>Clock</b><s></s><s></s><s></s></i><i style="left:0.00%;top:48.16%;width:calc(30.56% - 7px);height:calc(53.99% - 7px)"><b><i class="bk-ico bk-ico--calendar" aria-hidden="true"></i>Calendar</b><s></s><s></s><s></s></i><i class="is-web" style="left:30.56%;top:0.00%;width:calc(43.63% - 7px);height:calc(102.15% - 7px)"><b>app.slack.com</b><em><s></s><s></s><s></s><s></s><s></s><s></s></em></i><i style="left:74.18%;top:0.00%;width:calc(26.96% - 7px);height:calc(102.15% - 7px)"><b><i class="bk-ico bk-ico--messages" aria-hidden="true"></i>Messages</b><s></s><s></s><s></s><s></s><s></s><s></s></i></span><span class="bk-tcard__check"><i class="bk-ico bk-ico--check" aria-hidden="true"></i></span></span><span class="bk-tcard__text"><b>Remote team</b><span>Who is awake, what's on and what's new.</span></span><span class="bk-tcard__has"><span>Clock</span><span>Calendar</span><span>Slack</span><span>Messages</span></span></button><button class="bk-tcard bk-tile" type="button" data-template="markets" aria-pressed="false"><span class="bk-tcard__map" aria-hidden="true"><span class="bk-tcard__board"><i class="is-web" style="left:0.00%;top:0.00%;width:calc(46.90% - 7px);height:calc(102.15% - 7px)"><b>google.com/finance</b><em><s></s><s></s><s></s><s></s><s></s><s></s></em></i><i class="is-web" style="left:46.90%;top:0.00%;width:calc(32.19% - 7px);height:calc(102.15% - 7px)"><b>reuters.com/markets</b><em><s></s><s></s><s></s><s></s><s></s><s></s></em></i><i style="left:79.08%;top:0.00%;width:calc(22.06% - 7px);height:calc(48.16% - 7px)"><b><i class="bk-ico bk-ico--clock" aria-hidden="true"></i>Clock</b><s></s><s></s><s></s></i><i style="left:79.08%;top:48.16%;width:calc(22.06% - 7px);height:calc(53.99% - 7px)"><b><i class="bk-ico bk-ico--note" aria-hidden="true"></i>Notes</b><s></s><s></s><s></s></i></span><span class="bk-tcard__check"><i class="bk-ico bk-ico--check" aria-hidden="true"></i></span></span><span class="bk-tcard__text"><b>Markets</b><span>Your watchlist, the news and the open exchanges.</span></span><span class="bk-tcard__has"><span>Watchlist</span><span>News</span><span>Clock</span><span>Notes</span></span></button><button class="bk-tcard bk-tile" type="button" data-template="study" aria-pressed="false"><span class="bk-tcard__map" aria-hidden="true"><span class="bk-tcard__board"><i style="left:0.00%;top:0.00%;width:calc(33.82% - 7px);height:calc(102.15% - 7px)"><b><i class="bk-ico bk-ico--calendar" aria-hidden="true"></i>Calendar</b><s></s><s></s><s></s><s></s><s></s><s></s></i><i style="left:33.82%;top:0.00%;width:calc(33.82% - 7px);height:calc(102.15% - 7px)"><b><i class="bk-ico bk-ico--checklist" aria-hidden="true"></i>Reminders</b><s></s><s></s><s></s><s></s><s></s><s></s></i><i style="left:67.65%;top:0.00%;width:calc(33.50% - 7px);height:calc(51.23% - 7px)"><b><i class="bk-ico bk-ico--note" aria-hidden="true"></i>Notes</b><s></s><s></s><s></s></i><i class="is-web" style="left:67.65%;top:51.23%;width:calc(33.50% - 7px);height:calc(50.92% - 7px)"><b>docs.google.com</b><em><s></s><s></s><s></s></em></i></span><span class="bk-tcard__check"><i class="bk-ico bk-ico--check" aria-hidden="true"></i></span></span><span class="bk-tcard__text"><b>Study</b><span>Deadlines, to-dos and what you're reading.</span></span><span class="bk-tcard__has"><span>Calendar</span><span>Reminders</span><span>Notes</span><span>Docs</span></span></button><button class="bk-tcard bk-tile" type="button" data-template="creator" aria-pressed="false"><span class="bk-tcard__map" aria-hidden="true"><span class="bk-tcard__board"><i class="is-web" style="left:0.00%;top:0.00%;width:calc(51.80% - 7px);height:calc(102.15% - 7px)"><b>studio.youtube.com</b><em><s></s><s></s><s></s><s></s><s></s><s></s></em></i><i class="is-web" style="left:51.80%;top:0.00%;width:calc(49.35% - 7px);height:calc(51.07% - 7px)"><b>plausible.io</b><em><s></s><s></s><s></s></em></i><i style="left:51.80%;top:51.07%;width:calc(24.84% - 7px);height:calc(51.07% - 7px)"><b><i class="bk-ico bk-ico--calendar" aria-hidden="true"></i>Calendar</b><s></s><s></s><s></s></i><i style="left:76.63%;top:51.07%;width:calc(24.51% - 7px);height:calc(51.07% - 7px)"><b><i class="bk-ico bk-ico--note" aria-hidden="true"></i>Notes</b><s></s><s></s><s></s></i></span><span class="bk-tcard__check"><i class="bk-ico bk-ico--check" aria-hidden="true"></i></span></span><span class="bk-tcard__text"><b>Creator</b><span>Your channel, your numbers and your schedule.</span></span><span class="bk-tcard__has"><span>Studio</span><span>Analytics</span><span>Calendar</span><span>Notes</span></span></button></div><div class="bk-tpl__foot"><button class="bk-btn" type="button" data-empty>Start empty</button><button class="bk-btn bk-btn--accent" type="button" data-use>Use Workday</button></div></div></div></div>
<script>
var names = {};
document.querySelectorAll('.bk-tcard').forEach(function (card) { names[card.dataset.template] = card.querySelector('b').textContent; });
var useButton = document.querySelector('[data-use]');
document.querySelectorAll('.bk-tcard').forEach(function (card) {
  card.addEventListener('click', function () {
    document.querySelectorAll('.bk-tcard').forEach(function (other) {
      other.classList.toggle('is-selected', other === card);
      other.setAttribute('aria-pressed', String(other === card));
    });
    useButton.textContent = 'Use ' + names[card.dataset.template];
    useButton.dataset.template = card.dataset.template;
  });
});
useButton.dataset.template = 'workday';
</script>
</body>
</html>
